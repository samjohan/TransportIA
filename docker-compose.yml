services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rutas_gastos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    # Not exposed on the host — only `backend` talks to it, over the
    # internal Docker network at host "db". Port 5432 collided with a
    # Postgres already running on this machine. Add "ports: ['5433:5432']"
    # here if you want to connect to it from a host-side client.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-reference
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: rutas_gastos
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Runs the OCR job inline instead of needing a separate queue worker —
      # fine for this demo stack since ProcesarOcrRecibo is still a placeholder.
      QUEUE_CONNECTION: sync
    ports:
      # Host port 8000 was already taken on this machine — mapped to 8080
      # instead. Container-internal port (used by VITE_API_PROXY_TARGET
      # below) stays 8000.
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

  web-dashboard:
    build: ./web-dashboard
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      # Host port 5173 was already taken on this machine — mapped to 5183.
      - "5183:5173"
    depends_on:
      - backend

  driver-app:
    build: ./driver-app
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  db_data:
